name: tests

on:
  pull_request:
    branches:
      - agent/main
  push:
    branches:
      - agent/main
      - "cursor/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          CYBERNETIC_SKIP_LIVE_DECISIONS: "1"
        run: pytest
